<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" 
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <title>Increasing Counter</title>
</head>
<body>
    <div class="container">
        <div class="counter-container">
         <i class="fa-brands fa-linkedin fa-5x"></i>
         <div class="counter" data-target="2469"></div>
         <span>linkedin</span>

    </div>
        <div class="counter-container">
         <i class="fa-brands fa-github  fa-5x"></i>
         <div class="counter" data-target="645"></div>
         <span>Github</span>
    </div>
        <div class="counter-container">
            <i class="fa-brands fa-youtube fa-5x"></i>
         <div class="counter" data-target="700"></div>
         <span>Youtube</span>
    </div>

        <div class="counter-container">
            <i class="fa-brands fa-x-twitter fa-5x"></i>
         <div class="counter" data-target="3146"></div>
         <span>x-twitter</span>
    </div>
  
        <div class="counter-container">
            <i class="fa-brands fa-medium fa-5x"></i>
         <div class="counter" data-target="514"></div>
         <span>Medium</span>
    </div>
    
        <div class="counter-container">
         <i class="fa-brands fa-instagram fa-5x"></i>
         <div class="counter" data-target="1598"></div>
         <span>instagram</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
